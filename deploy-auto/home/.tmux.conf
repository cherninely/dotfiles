# Load plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'odedlaz/tmux-onedark-theme'    # one dark theme
set -g @plugin 'tmux-plugins/tmux-yank'        # Cross-platform support for clipboard.
set -g @plugin 'tmux-plugins/tmux-resurrect'   # Save/Restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # Auto Save/Restore

# Use Ctrl+A as the prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Restore using continuum
set -g @continuum-restore 'on'

# claude is deliberately not in @resurrect-processes: ~20 sessions restarting at once
# with their MCP servers ran the Mac out of memory. The restore hook types
# `cs --resume <uuid>` into each claude pane instead, it runs on Enter.
# resurrect drops pane options, so the ❓/✅/💤 and the resume command are carried by hand.
set -g @resurrect-hook-post-save-all '~/bin/cc-tmux-state-persist save'
set -g @resurrect-hook-post-restore-all '~/bin/cc-tmux-state-persist restore'

set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set-environment -g 'SSH_AUTH_SOCK' ~/.ssh/ssh_auth_sock

# Enable scroll, resize panes, select splits and windows by mouse
set -g mouse on

# Propagate terminal focus events to apps (Claude Code, nvim autoread, etc.)
set -g focus-events on

# Keep window numbers contiguous after closing.
set -g renumber-windows on

# Resize to the smallest client actually viewing the window, not the session.
setw -g aggressive-resize on

# Scroll History — large buffer for Claude Code diffs/logs/stacktraces.
set -g history-limit 100000

# Set first window to index 1 (not 0) to map more to the keyboard layout...
set -g base-index 1
setw -g pane-base-index 1

# Set ability to capture on start and restore on exit window data when running an application
setw -g alternate-screen on

# Zero escape timing — fixes insert-mode exit lag in vim/nvim and Claude TUI.
set -s escape-time 0

# act like vim
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy and paste like in vim
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Reload tmux.conf on prexif+r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Use 256 colours.
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g default-terminal "screen-256color"

# Pass Shift+Enter and other extended keys through to apps (Claude Code, etc.)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# How often the #() jobs of the status line run (Claude state, ticket titles).
set -g status-interval 5

# Make prefix + u maximize pane and prefix + i restore everything back, work shitty if you change window after
# pressing Down
unbind Up
unbind Down
bind Up new-window -d -n tmp \; swap-pane -s tmp.1 \; select-window -t tmp
bind Down last-window \; swap-pane -s tmp.1 \; kill-window -t tmp

# Do not rename window titles automatically
set-window-option -g automatic-rename off

# Set the name of the window initially, but then don't let tmux change it.
# The name can still be set at any time with Ctrl+B + ,
set-option -g allow-rename off

# No activity/bell flags in tmux — Claude Code's state comes from the hook below.
# Bells from inactive windows still reach the terminal (dock bounce), nothing more.
setw -g monitor-activity off
setw -g monitor-bell off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action other

# Claude Code state per pane (@cc_state = working|blocked|done|waiting, written by
# ~/.claude/hooks/cc-tmux-state.sh; waiting only by prefix+w below). Unlike the bell it
# is a state, not a flash: it stays until the session actually moves on.
#
# The pieces below are user options expanded with #{E:...} from the tab formats and
# from choose-tree, otherwise every format would repeat the same pane loop four times.
# A pane counts only while claude actually runs there (its process name is the
# version, 2.1.272) or sleeps with @cc_resume, so a state left behind by a crashed
# session does not stick.
set -g @cc_wstate  '#{P:#{?#{||:#{m/r:^[0-9]+.[0-9]+,#{pane_current_command}},#{@cc_resume}},#{@cc_state},}}'
# ❓ blocked on a question/permission, ⏳ working, ✅ turn finished, 💤 waiting for something
# outside (a colleague, a nightly run), set by hand with prefix+w.
set -g @cc_wicon   '#{?#{m:*blocked*,#{E:@cc_wstate}},❓,#{?#{m:*done*,#{E:@cc_wstate}},✅,#{?#{m:*working*,#{E:@cc_wstate}},⏳,#{?#{m:*waiting*,#{E:@cc_wstate}},💤,}}}}'
# Colour of the state: yellow needs me, green finished, blue working, dim grey waiting
# (the tab fades); empty without claude.
set -g @cc_waccent '#{?#{m:*blocked*,#{E:@cc_wstate}},#e5c07b,#{?#{m:*done*,#{E:@cc_wstate}},#98c379,#{?#{m:*working*,#{E:@cc_wstate}},#61afef,#{?#{m:*waiting*,#{E:@cc_wstate}},#5c6370,}}}}'
# Fill of the current tab. Every state fills the tab with its colour except waiting: dark
# text on the dim grey is unreadable, so a waiting current tab keeps the plain block and
# only its text fades.
set -g @cc_wfill   '#{?#{==:#{E:@cc_waccent},#5c6370},,#{E:@cc_waccent}}'
# Conversation name: claude publishes it as the terminal title ("✳ name"), so /rename
# and `cs -n` show up here by themselves. A pane with @cc_resume is a sleeping session
# (claude exited or not started after a restore) and keeps the name from its title:
# claude wipes the title on exit, `cs` puts it back.
set -g @cc_wtitle  '#{P:#{?#{||:#{m/r:^[0-9]+.[0-9]+,#{pane_current_command}},#{&&:#{@cc_resume},#{m:*✳*,#{pane_title}}}},#{s/^ *✳ //:#{pane_title}},}}'
# Tab label. The first window of a session (tm names it "root"; the name itself is not
# shown) carries the session's identity: its conversation name, or the session name when
# no claude runs there. Every other window is a child of it, spawned as a subtask or
# opened by hand, and gets a ↳ in front; without claude it keeps its tmux name.
set -g @cc_wlabel  '#{?#{==:#{window_name},root},#{?#{E:@cc_wtitle},#{E:@cc_wtitle},#{session_name}},↳ #{?#{E:@cc_wtitle},#{E:@cc_wtitle},#{window_name}}}'

# choose-tree (prefix + s), coloured like the tabs. A session line lists every window: one
# with a state as a block filled with its colour ("1✅ 2⏳", each on its own colour), because
# one aggregated icon hid a finished session behind a working one; one without a state (claude
# just started or was resumed and has not spoken yet, or no claude at all) as a dim index, so
# the line counts the same windows as the tabs. With a single window the index is dropped.
# The block is the only place the colour can show: tmux
# prints the session name itself, before the format and in the default style, and the
# emoji ignore fg, so a bare coloured icon looked like no colour at all. Inside #[...]
# attributes are separated by spaces: a comma there would end the #{W:...} branch. A session is named after its first conversation (the ticket title when it
# has a key, see ~/bin/cc-tmux-task), and choose-tree always prints the session name
# itself before the format text (hard-coded, so only the suffix is rendered here).
# The window count tmux shows by default is left out: the icons already say how many
# windows matter. A window line shows its conversation name, or what its tab falls back
# to without one (the window name, the session name for root). No preview (-N): with it the
# list got only the upper half of the screen, and one expanded session pushed the rest off it.
# tmux forgets which sessions were expanded, so the current one is expanded on every open
# (Right on the session line the cursor starts at); the rest stay collapsed. A session with
# a single window stays collapsed too: its only window line would repeat the session line.
bind s choose-tree -ZsN -F '#{?session_format,\
#{W:#{?#{E:@cc_wicon},#[fg=#{?#{==:#{E:@cc_waccent},#5c6370},#dcdfe4,#282c34} bg=#{E:@cc_waccent}] #{?#{==:#{session_windows},1},,#{window_index}}#{E:@cc_wicon} #[default] ,#{?#{==:#{session_windows},1},,#[fg=#5c6370]#{window_index}#[default] }}}\
#{?session_grouped,(group #{session_group}: #{session_group_list}) ,}#{?session_attached,(attached),},\
#{?window_format,\
#[fg=#{?#{E:@cc_waccent},#{E:@cc_waccent},#aab2bf}]#{?#{E:@cc_wicon},#{E:@cc_wicon} ,}#{?#{E:@cc_wtitle},#{E:@cc_wtitle},#{?#{==:#{window_name},root},#{session_name},#{window_name}}},}}' \; if -F '#{>:#{session_windows},1}' 'send-keys Right'

# The selected line in choose-tree (and the copy-mode selection) is grey instead of
# tmux's yellow, otherwise a yellow ❓ line disappears when selected.
set -g mode-style 'fg=#dcdfe4,bg=#3e4452'

# prefix + m: toggle ✅ for the current window (tab). With a ✅ in it: drop it ("read, parked"),
# the tab looks fresh again and the conversation keeps running. Without one: put ✅ back on
# the claude pane (undo, or flag a tab to return to). ⏳, ❓ and 💤 are left alone. Only this window,
# not the whole session: a session is a folder of tabs. run-shell expands formats,
# so the window and the client for the message are the ones that pressed the key. Single quotes
# matter: the id looks like $3 and sh would otherwise expand it as its own argument.
bind m run-shell "~/bin/cc-tmux-park '#{window_id}' '#{client_name}'"

# prefix + w: toggle 💤 for the current window: the conversation waits for something outside
# (a colleague's OK, a nightly run), so the tab fades instead of asking for attention. The
# next message or turn clears it by itself (the hook overwrites the state). ⏳ is left alone:
# claude is doing something there, the mark would flip back within seconds. Replaces the
# default window list, which prefix+s covers.
bind w run-shell "~/bin/cc-tmux-wait '#{window_id}' '#{client_name}'"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# The theme paints its colours through status-bg, message-fg and the like, which tmux 3
# no longer has (only the -style options); the theme sets them with -q, so they fail
# silently and the gap between the tabs and the right corner stayed tmux's default
# green. The same palette, set the tmux 3 way.
set -g status-style "bg=#282c34,fg=#aab2bf"
set -g message-style "bg=#282c34,fg=#aab2bf"
set -g message-command-style "bg=#282c34,fg=#aab2bf"

# Tabs of the status line. The onedark theme resets window-status-*-format and
# status-left from its plugin script, so this has to come after tpm.
#
# A tab is 24–32 cells: " <index>  <label> <icon> ". The current tab is a filled block
# in the state colour with dark text, the other tabs are text in the state colour;
# without a state the theme's grey and white are used.
setw -g window-status-separator "#[fg=#3e4452,bg=#282c34]│"
setw -g window-status-format "#[fg=#{?#{E:@cc_waccent},#{E:@cc_waccent},#aab2bf},bg=#282c34,nobold] #I  #{=/32/…:#{p24:#{E:@cc_wlabel}}} #{E:@cc_wicon} "
setw -g window-status-current-format "#[fg=#282c34,bg=#{?#{E:@cc_wfill},#{E:@cc_wfill},#3e4452},nobold]#[fg=#{?#{E:@cc_wfill},#282c34,#{?#{E:@cc_waccent},#{E:@cc_waccent},#aab2bf}},bg=#{?#{E:@cc_wfill},#{E:@cc_wfill},#3e4452},bold] #I  #{=/32/…:#{p24:#{E:@cc_wlabel}}} #{E:@cc_wicon} #[fg=#{?#{E:@cc_wfill},#{E:@cc_wfill},#3e4452},bg=#282c34,nobold]"

# Left corner: empty, the tabs start at the edge. The session name used to sit here, but
# it is derived from the first window's conversation (~/bin/cc-tmux-task), which the
# first tab shows by itself now. A prefix marker was tried and dropped: it pushed the
# tabs sideways on every prefix press. The theme's status-left carried
# #{prefix_highlight} for a plugin that is not installed.
set -g status-left ""

# Right corner: only the Claude sessions that need me, ❓N ✅N, as a block in the state
# colour like the tabs (~/bin/cc-tmux-summary prints it styled); empty when nothing needs
# me. The theme's clock, date and host name are gone: the clock is in the menu bar and the
# host is always this Mac. Continuum hooks its auto-save into status-right at plugin load,
# so overriding the option here has to put that job back, otherwise sessions silently stop
# being saved. The session-naming job (~/bin/cc-tmux-task) runs from here too and prints
# nothing.
set -g status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#(~/bin/cc-tmux-task)#(~/bin/cc-tmux-summary)"
