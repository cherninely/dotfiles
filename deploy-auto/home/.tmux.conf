# Load plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'odedlaz/tmux-onedark-theme'    # one dark theme
set -g @plugin 'tmux-plugins/tmux-yank'        # Cross-platform support for clipboard.
set -g @plugin 'tmux-plugins/tmux-resurrect'   # Save/Restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # Auto Save/Restore

# Use Ctrl+A as the prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Restore using continuum
set -g @continuum-restore 'on'

# Restart `claude` panes after restore with their original arguments: `cs` starts
# claude with a fixed --session-id, so the same conversation comes back by itself.
set -g @resurrect-processes '"~claude->cs *"'

set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set-environment -g 'SSH_AUTH_SOCK' ~/.ssh/ssh_auth_sock

# Enable scroll, resize panes, select splits and windows by mouse
set -g mouse on

# Propagate terminal focus events to apps (Claude Code, nvim autoread, etc.)
set -g focus-events on

# Keep window numbers contiguous after closing.
set -g renumber-windows on

# Resize to the smallest client actually viewing the window, not the session.
setw -g aggressive-resize on

# Scroll History — large buffer for Claude Code diffs/logs/stacktraces.
set -g history-limit 100000

# Set first window to index 1 (not 0) to map more to the keyboard layout...
set -g base-index 1
setw -g pane-base-index 1

# Set ability to capture on start and restore on exit window data when running an application
setw -g alternate-screen on

# Zero escape timing — fixes insert-mode exit lag in vim/nvim and Claude TUI.
set -s escape-time 0

# act like vim
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy and paste like in vim
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Reload tmux.conf on prexif+r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Use 256 colours.
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g default-terminal "screen-256color"

# Pass Shift+Enter and other extended keys through to apps (Claude Code, etc.)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Claude Code sessions that need me (❓ blocked ✅ done). Absolute path: #() jobs
# run without the shell's PATH and without $TMUX.
set -g @onedark_widgets "#(~/bin/cc-tmux-summary)"
set -g @onedark_date_format "%d/%m/%y"
set -g status-interval 5

# Make prefix + u maximize pane and prefix + i restore everything back, work shitty if you change window after
# pressing Down
unbind Up
unbind Down
bind Up new-window -d -n tmp \; swap-pane -s tmp.1 \; select-window -t tmp
bind Down last-window \; swap-pane -s tmp.1 \; kill-window -t tmp

# Do not rename window titles automatically
set-window-option -g automatic-rename off

# Set the name of the window initially, but then don't let tmux change it.
# The name can still be set at any time with Ctrl+B + ,
set-option -g allow-rename off

# No activity/bell flags in tmux — Claude Code's state comes from the hook below.
# Bells from inactive windows still reach the terminal (dock bounce), nothing more.
setw -g monitor-activity off
setw -g monitor-bell off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action other

# Claude Code state per pane (@cc_state = working|blocked|done, written by
# ~/.claude/hooks/cc-tmux-state.sh). Unlike the bell it is a state, not a flash:
# it stays until the session actually moves on.
#
# In choose-tree (prefix + s): ❓ blocked on a question/permission, ⏳ working,
# ✅ turn finished. Session lines aggregate every pane of the session. A pane's state counts only
# while claude actually runs there (its process name is the version, 2.1.272),
# so a state left behind by a crashed session does not stick.
# choose-tree itself prepends "<name>: " to the format text, so we only render the suffix.
bind s choose-tree -Zs -F '#{?session_format,\
#{?#{m:*blocked*,#{W:#{P:#{?#{m/r:^[0-9]+.[0-9]+,#{pane_current_command}},#{@cc_state},} }}},❓ ,\
#{?#{m:*working*,#{W:#{P:#{?#{m/r:^[0-9]+.[0-9]+,#{pane_current_command}},#{@cc_state},} }}},⏳ ,\
#{?#{m:*done*,#{W:#{P:#{?#{m/r:^[0-9]+.[0-9]+,#{pane_current_command}},#{@cc_state},} }}},✅ ,}}}\
#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),},\
#{?window_format,\
#{?#{m:*blocked*,#{P:#{?#{m/r:^[0-9]+.[0-9]+,#{pane_current_command}},#{@cc_state},} }},❓ ,\
#{?#{m:*working*,#{P:#{?#{m/r:^[0-9]+.[0-9]+,#{pane_current_command}},#{@cc_state},} }},⏳ ,\
#{?#{m:*done*,#{P:#{?#{m/r:^[0-9]+.[0-9]+,#{pane_current_command}},#{@cc_state},} }},✅ ,}}}\
#{window_panes} panes,#{pane_current_command}}}'

# prefix + m: toggle ✅ for the current session. With a ✅ anywhere in it: drop it ("read, parked"),
# the session looks fresh again and the conversation keeps running. Without one: put ✅ back on
# the claude pane (undo, or flag a session to return to). ⏳ and ❓ are left alone. run-shell expands formats,
# so the session and the client for the message are the ones that pressed the key. Single quotes
# matter: the id looks like $3 and sh would otherwise expand it as its own argument.
bind m run-shell "~/bin/cc-tmux-park '#{session_id}' '#{client_name}'"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
